# Airshed configuration — the single source of truth for constants.
# No magic numbers in modules (CLAUDE.md, Conventions).

[project]
name    = "airshed"
tz_display = "Asia/Kolkata"   # IST — presentation layer only. Internals are UTC.

# ---------------------------------------------------------------------------
# Spatial domain
# ---------------------------------------------------------------------------
[domain]
# Delhi NCR bounding box (lon/lat, WGS84). Wide enough to hold Sonipat in the
# north and Faridabad/Ballabgarh in the south, Bahadurgarh west, Gr. Noida east.
lat_min = 28.10
lat_max = 29.10
lon_min = 76.70
lon_max = 77.70

# Regular grid used for the downscaled surface (Phase 4) and for sampling CAMS.
# 0.05 deg ~ 5.5 km. CAMS itself is ~40 km — see R7: this grid is our
# downscaling target, not a claim about CAMS resolution.
grid_step_deg = 0.05

# Upwind stubble-burning region (Punjab + Haryana) for FIRMS fire counts.
[domain.fire_region]
lat_min = 28.5
lat_max = 32.6
lon_min = 73.8
lon_max = 77.6

# ---------------------------------------------------------------------------
# Horizons — the forecast targets. Hours ahead of forecast issue time.
# ---------------------------------------------------------------------------
[forecast]
horizons_h = [24, 48, 72]
issue_hour_utc = 0          # nominal daily issue time (05:30 IST)

# ---------------------------------------------------------------------------
# GRAP — Graded Response Action Plan.
# Statutory thresholds, transcribed from the CAQM revised GRAP schedule
# (Commission for Air Quality Management, order dated 2022-08-05, as amended
# 2023-12; stages keyed to the FORECAST AQI for Delhi, not the observed one).
# Source: https://caqm.nic.in/  (revised GRAP schedule PDF)
#
# NOTE: GRAP is invoked on Delhi's city-wide average AQI, not per station.
# grap.py aggregates stations to a city AQI before staging. Do not apply these
# per station and call the result "GRAP stage".
# ---------------------------------------------------------------------------
[grap]
aggregate = "city_mean_aqi"


[[grap.stages]]
stage      = 1
name       = "Poor"
aqi_min    = 201
aqi_max    = 300

[[grap.stages]]
stage      = 2
name       = "Very Poor"
aqi_min    = 301
aqi_max    = 400

[[grap.stages]]
stage      = 3
name       = "Severe"
aqi_min    = 401
aqi_max    = 450

[[grap.stages]]
stage      = 4
name       = "Severe Plus"
aqi_min    = 451
aqi_max    = 1000

# ---------------------------------------------------------------------------
# CPCB National AQI sub-index breakpoints for PM2.5 (24-hour average, ug/m3).
# CPCB, "National Air Quality Index" report (2014), Table 2.
# AQI = linear interpolation within the bracket the concentration falls in.
# ---------------------------------------------------------------------------
[[aqi.pm25_breakpoints]]
c_lo = 0.0
c_hi = 30.0
i_lo = 0
i_hi = 50

[[aqi.pm25_breakpoints]]
c_lo = 30.0
c_hi = 60.0
i_lo = 51
i_hi = 100

[[aqi.pm25_breakpoints]]
c_lo = 60.0
c_hi = 90.0
i_lo = 101
i_hi = 200

[[aqi.pm25_breakpoints]]
c_lo = 90.0
c_hi = 120.0
i_lo = 201
i_hi = 300

[[aqi.pm25_breakpoints]]
c_lo = 120.0
c_hi = 250.0
i_lo = 301
i_hi = 400

[[aqi.pm25_breakpoints]]
c_lo = 250.0
c_hi = 380.0
i_lo = 401
i_hi = 500

# ---------------------------------------------------------------------------
# Data sources
# ---------------------------------------------------------------------------
[sources.cams]
url          = "https://air-quality-api.open-meteo.com/v1/air-quality"
hourly       = ["pm2_5", "pm10", "carbon_monoxide", "nitrogen_dioxide", "sulphur_dioxide", "ozone", "dust", "aerosol_optical_depth"]
domains      = "cams_global"
forecast_days = 5
max_past_days = 92          # Open-Meteo air-quality past_days cap

[sources.meteo]
# R1: serving and training use DIFFERENT endpoints and must stay separate.
serving_url  = "https://api.open-meteo.com/v1/forecast"
training_url = "https://historical-forecast-api.open-meteo.com/v1/forecast"

# Pinned to GFS, not best_match, and that is a measured decision:
# boundary_layer_height is served ONLY by the GFS family. ECMWF (ifs04,
# ifs025), ICON and JMA all return it empty for Delhi in both seasons tested.
# Since mixing height is the single most important variable for whether
# today's emissions stay in the city, we take GFS everywhere rather than a
# better model with the key variable missing.
model        = "gfs_seamless"

# boundary_layer_height only exists in the archive from this date. Verified:
# 2024-08-01 and 2024-09-01 return 0/24 non-null; 2024-09-15 onward returns
# 24/24, and it is still present in 2026. Training that needs real BLH must
# start here; earlier history falls back to the documented lapse-rate proxy
# and carries blh_available = false.
blh_available_from = "2024-09-15"

hourly       = [
  "temperature_2m", "relative_humidity_2m", "dew_point_2m", "surface_pressure",
  "wind_speed_10m", "wind_direction_10m", "wind_gusts_10m", "wind_speed_100m",
  "wind_direction_100m", "boundary_layer_height", "precipitation",
  "cloud_cover", "shortwave_radiation", "cape", "visibility",
  "temperature_925hPa", "temperature_850hPa", "wind_speed_925hPa",
  "wind_direction_925hPa", "geopotential_height_925hPa",
]
forecast_days = 5

# ---------------------------------------------------------------------------
# Lead-matched training meteorology (Previous Runs API)
# ---------------------------------------------------------------------------
# `training_url` above returns the *best available* forecast for each past
# hour, which in practice is a short-lead one. Training on that and serving a
# genuine 72 h forecast is the same class of distribution mismatch R1 exists to
# prevent, one level down: not reanalysis-vs-forecast, but short-lead-vs-long-
# lead. The Previous Runs API fixes it by serving, for a valid hour on day D,
# the value from the run initialised on day D-N.
#
#   lead_day N  ->  lead = 24N + hour_of_day, i.e. N=1 covers 24-47 h.
#
# Verified 2026-08-24 against our own stored `meteo_runs`: the API's main
# series reproduced the run we archived that morning exactly (max diff 0.000
# over 24 h), and `previous_day1` reproduced the previous day's run. Coverage
# is 48/48 non-null at 2025-02-18, 2025-06-01, 2025-11-05 and 2026-08-20, so
# the whole trainable era is served.
previous_runs_url = "https://previous-runs-api.open-meteo.com/v1/forecast"
lead_matched_days = [1, 2, 3]

# Only these variables have `_previous_dayN` variants. Measured, not assumed.
lead_matched_hourly = [
  "temperature_2m", "relative_humidity_2m", "dew_point_2m", "surface_pressure",
  "wind_speed_10m", "wind_direction_10m", "wind_gusts_10m", "wind_speed_100m",
  "wind_direction_100m", "precipitation", "cloud_cover", "shortwave_radiation",
  "cape",
]

# These CANNOT be lead-matched retrospectively, and it matters that the list is
# written down rather than discovered again later:
#   boundary_layer_height, visibility  -> `_previous_dayN` returns 0/72 non-null
#                                         on every GFS variant tried
#   temperature_925hPa, temperature_850hPa, wind_speed_925hPa,
#   wind_direction_925hPa, geopotential_height_925hPa
#                                      -> HTTP 400, the API rejects
#                                         `_previous_dayN` on pressure levels
# Consequence: BLH, the inversion features and ventilation_index stay
# short-lead in training. At *serving* time they are genuine long-lead values
# from the live run, so this is a residual train/serve gap that can only be
# closed forward, as `meteo_runs` accumulates. Any row built this way carries
# `met_lead_matched = false` for those columns' sake.
lead_matched_unavailable = [
  "boundary_layer_height", "visibility", "temperature_925hPa",
  "temperature_850hPa", "wind_speed_925hPa", "wind_direction_925hPa",
  "geopotential_height_925hPa",
]

[sources.metar]
url        = "https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py"
stations   = ["VIDP", "VIDD"]   # VIDP = IGI Airport, Delhi. VIDD = Safdarjung.
elements   = ["vsby", "tmpf", "dwpf", "relh", "drct", "sknt", "p01i", "mslp"]

[sources.cpcb]
# Ground truth. Two backends, both defined in ingest/cpcb.py:
#   openaq_archive : public S3 bulk archive, NO API key, historical (training)
#   openaq_api     : OpenAQ v3 REST, needs OPENAQ_API_KEY, recent/live (serving)
archive_bucket_url = "https://openaq-data-archive.s3.amazonaws.com"
api_url            = "https://api.openaq.org/v3"
parameter          = "pm25"
# R6: never interpolate across a gap longer than this. Shorter gaps may be
# bridged only where a module explicitly says so, and always flagged.
max_bridge_gap_h   = 2

[sources.firms]
url        = "https://firms.modaps.eosdis.nasa.gov/api/area/csv"
products   = ["VIIRS_SNPP_NRT", "VIIRS_NOAA20_NRT", "MODIS_NRT"]
# Historical (non-NRT) archive product names differ; see ingest/fires.py.
archive_products = ["VIIRS_SNPP_SP", "MODIS_SP"]

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
[storage]
root         = "data"
raw          = "data/raw"
processed    = "data/processed"

# ---------------------------------------------------------------------------
# Splits — R3: time-block only, whole episodes held out. Never random.
# ---------------------------------------------------------------------------
[split]
# Held-out test blocks. November blocks are deliberately whole episodes.
# Blocks sit inside the BLH era (sources.meteo.blh_available_from) AND inside
# the period OpenAQ actually holds CPCB observations for: 2025-02-18 onward.
# OpenAQ has a gap between 2018-02 and 2025-02 for these stations, so there is
# exactly ONE winter episode season available (2025-26).
#
# The season contains two comparable severe months -- November 2025 (30.7% of
# hours above 250 ug/m3) and December 2025 (30.5%) -- so the split trains
# through November and tests on December-January. That satisfies three things
# at once:
#   * whole contiguous episodes are held out, never scattered hours (R3);
#   * training precedes evaluation in time, as it would in operation;
#   * training and holdout describe the same atmosphere, so a poor score is a
#     verdict on the model rather than on data coverage. The first run of this
#     ablation held out November while training only on Feb-Oct, and every
#     learned model lost to persistence purely because it had never seen an
#     episode. The ablation now prints a regime check for exactly that reason.
test_blocks = [
  { start = "2025-12-15", end = "2026-01-31", label = "winter-late-2025" },
  { start = "2026-06-01", end = "2026-06-30", label = "summer-2026" },
]
val_blocks = [
  { start = "2025-12-01", end = "2025-12-10", label = "december-early-2025" },
  { start = "2025-05-01", end = "2025-05-20", label = "may-2025" },
]
# Gap in hours to purge either side of a block boundary so a 72 h target
# cannot straddle train and test.
embargo_h = 96

