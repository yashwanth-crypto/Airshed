# ---------------------------------------------------------------------------
# Upwind network -- the airshed, not the city.
#
# Delhi's severe episodes are substantially imported. Stubble smoke from Punjab
# and Haryana takes roughly 12-36 hours to arrive, which means an upwind monitor
# is a *leading indicator* that no amount of local history can substitute for.
# These 24 stations span the corridor from Rohtak at 65 km out to Jalandhar at
# 340 km, all bearing 280-360 degrees from Delhi and all reporting as of
# 2026-08-23.
#
# They are deliberately NOT in `stations`. They are predictors only:
#   * never forecast targets,
#   * never part of the city average GRAP is keyed to,
#   * never in leave-one-station-out.
# Mixing them into the NCR set would silently change what "Delhi AQI" means.
# Cached to the `cpcb_upwind` dataset for the same reason.
#
# Generated from the OpenAQ locations API rather than transcribed by hand;
# distance and bearing are measured from Delhi centre (28.61 N, 77.21 E).
# ---------------------------------------------------------------------------
[upwind]
upwind_stations = [
  { id = "UW001", name = "MD University Rohtak - HSPCB", city = "Rohtak", agency = "CAAQMS", lat = 28.877930, lon = 76.620825, openaq_id = 7283, distance_km = 65, bearing_deg = 298 },
