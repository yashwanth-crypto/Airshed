[project]
name = "airshed"
version = "0.1.0"
description = "Air pollution-weather coupled forecasting for Delhi NCR (SIH26082)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "tzdata>=2024.1",   # zoneinfo has no system tz database on Windows
    "apscheduler>=3.10",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]

[project.scripts]
airshed = "airshed.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airshed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
